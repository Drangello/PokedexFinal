<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5a287f">
  <title>Shinydex – Masterball Pokédex</title>
  <link rel="icon" type="image/png" href="./abra_icon-icons.com_67592.png">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body class="initial-loading">
  <div id="initialLoader" class="masterball-loader" role="status" aria-live="polite">
    <div class="loader-ball" aria-hidden="true">
      <div class="loader-half loader-half--top">
        <span class="masterball-m">M</span>
      </div>
      <div class="loader-half loader-half--bottom"></div>
      <div class="loader-band"></div>
      <div class="loader-button">
        <span class="loader-button-core"></span>
        <span class="loader-spinner"></span>
      </div>
    </div>
    <p class="loader-copy">Pokémon werden geladen …</p>
  </div>

  <header class="masterball-header">
    <div class="header-inner">
      <a class="brand" href="#main" aria-label="Zum Shinydex">
        <span class="brand-icon"><img src="abra_icon-icons.com_67592.png" alt=""></span>
        <span>
          <span class="brand-kicker">Masterball Edition</span>
          <span class="brand-title">Shinydex</span>
        </span>
      </a>

      <label class="search-field" for="searchInput">
        <span class="search-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Pokémon suchen</span>
        <input
          type="search"
          id="searchInput"
          placeholder="Pokémon suchen …"
          autocomplete="off"
          spellcheck="false"
          disabled
        >
      </label>
    </div>
  </header>

  <main id="main" class="card-grid" aria-live="polite" aria-busy="true"></main>

  <div class="load-actions">
    <button id="loadBtn" class="load-button" type="button" disabled>
      <span class="button-spinner" aria-hidden="true"></span>
      <span class="load-button-label">Mehr Pokémon laden</span>
    </button>
  </div>

  <footer class="masterball-footer">
    <div class="footer-button" aria-hidden="true"><span></span></div>
    <div class="footer-content">
      <p><strong>Shinydex</strong> · Daten von der PokéAPI</p>
      <nav class="footer-links" aria-label="Rechtliche Informationen">
        <a href="./impressum.html">Impressum</a>
        <span aria-hidden="true">·</span>
        <a href="./datenschutz.html">Datenschutz</a>
      </nav>
    </div>
  </footer>

  <section id="overlay" class="overlay" aria-hidden="true" aria-label="Pokémon-Details">
    <div class="overlay-dialog" role="dialog" aria-modal="true">
      <div class="overlay-actions">
        <button id="muteBtn" class="icon-button" type="button" aria-label="Pokémon-Rufe stummschalten">
          <svg class="action-icon action-icon--sound" viewBox="0 0 24 24" aria-hidden="true">
            <path class="speaker-shape" d="M4 9v6h4l5 4V5L8 9H4Z"></path>
            <path class="sound-wave" d="M16 8.4a5 5 0 0 1 0 7.2M18.7 5.8a8.6 8.6 0 0 1 0 12.4"></path>
            <path class="mute-cross" d="m16.2 9.2 5.6 5.6m0-5.6-5.6 5.6"></path>
          </svg>
        </button>
        <button id="closeBtn" class="icon-button" type="button" aria-label="Detailansicht schließen">
          <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.5 6.5 17.5 17.5M17.5 6.5 6.5 17.5"></path>
          </svg>
        </button>
      </div>

      <button id="prevBtn" class="nav-button nav-button--previous" type="button" aria-label="Vorheriges Pokémon">
        <span aria-hidden="true">←</span>
        <span>Zurück</span>
      </button>

      <div id="fullCard" class="full-card"></div>

      <button id="nextBtn" class="nav-button nav-button--next" type="button" aria-label="Nächstes Pokémon">
        <span>Nächstes</span>
        <span aria-hidden="true">→</span>
      </button>
    </div>
  </section>
</body>

</html>
